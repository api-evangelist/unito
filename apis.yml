aid: unito
name: Unito
description: Unito is a two-way sync and integration platform that keeps work items
  in sync across 60+ SaaS tools such as Asana, Jira, Trello, GitHub, Azure DevOps,
  ServiceNow, Salesforce, and Smartsheet, with no-code field mappings and rules. For
  developers Unito offers a Connector Developer Platform (TypeScript SDK + CLI for
  building two-way sync connectors), an embeddable Sync Embed iframe, and the Unito
  Embed API - a REST API for embedding partners to manage workspaces and pull flow
  and workspace usage reports. Unito is SOC 2 Type 2 certified and based in Montreal,
  Canada.
